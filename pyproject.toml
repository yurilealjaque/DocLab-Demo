
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doclab"
version = "0.1.0"
description = "Aplicacion de escritorio para gestionar y convertir documentos"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
doclab = "doclab.main:main"

[tool.setuptools.packages.find]
where = ["src"]
